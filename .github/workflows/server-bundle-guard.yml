# Fails fast if shared server barrels re-export heavy deps (Vercel 250 MB limit).
name: Server bundle guard
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-barrels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.2"
      - run: bun install --frozen-lockfile
      - run: bun run verify:barrels
